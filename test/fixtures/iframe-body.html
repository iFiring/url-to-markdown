<main>
<h1>iframe 内的正文标题</h1>
<p>IFRAME_BODY 正文内容。这段文字要足够长，以便主文档文本稀少时，合并逻辑能把它识别为内容型 iframe 并合并进主文档。通过重复这句话来增加文本量。iframe 正文需要超过两百个字符才会被判定为内容型，所以这里继续重复补充篇幅，确保判定稳定。IFRAME_BODY 正文内容补充第二段，进一步加长文本。</p>
</main>
