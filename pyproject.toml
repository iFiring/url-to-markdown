[project]
name = "url-to-markdown"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.49,<2",
    "readability-lxml>=0.8.1",
    "markdownify>=0.13.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["test/unit"]
